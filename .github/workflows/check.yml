name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: dist/ 与 rules/ 一致性校验
        run: make check

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -x scripts/*.sh

      - name: 单元测试（菜单键位）
        run: npm test

      - name: CLI 冒烟测试（隔离 HOME）
        env:
          CLAUDE_HOME: /tmp/fake/.claude
          CODEX_HOME: /tmp/fake/.codex
        run: |
          node bin/cli.mjs --help
          node bin/cli.mjs rules --yes
          diff -q /tmp/fake/.claude/CLAUDE.md dist/claude/CLAUDE.md
          diff -q /tmp/fake/.codex/AGENTS.md dist/codex/AGENTS.md
          # 重复执行应幂等，且不产生备份
          node bin/cli.mjs rules --yes
          test ! -d /tmp/fake/.claude/backup
          # 已有文件应被完整备份到 backup/<时间戳>/
          echo old > /tmp/fake/.codex/AGENTS.md
          node bin/cli.mjs rules --target codex --yes
          grep -qx old "$(find /tmp/fake/.codex/backup -name AGENTS.md | head -1)"

      - name: npm 包内容校验
        run: npm pack --dry-run
