name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: dist/ 与 rules/ 一致性校验
        run: make check

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -x scripts/*.sh

      - name: 安装脚本冒烟测试（隔离 HOME）
        env:
          CLAUDE_HOME: /tmp/fake/.claude
          CODEX_HOME: /tmp/fake/.codex
        run: |
          ./scripts/install.sh --target all --yes
          test -L /tmp/fake/.claude/CLAUDE.md
          test -L /tmp/fake/.codex/AGENTS.md
          ./scripts/install.sh --target all --uninstall --yes
          test ! -e /tmp/fake/.claude/CLAUDE.md
